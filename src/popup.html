<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24" />
    <h1>downskool</h1>
  </header>

  <section class="options">
    <label>Formato
      <select id="format">
        <option value="mp4">Video (MP4)</option>
        <option value="mp3">Solo audio (MP3)</option>
        <option value="m4a">Solo audio (M4A)</option>
        <option value="wav">Solo audio (WAV)</option>
      </select>
    </label>
    <label>Calidad
      <select id="quality">
        <option value="best">Máxima</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </label>
  </section>

  <section id="course" hidden>
    <div class="row">
      <h2 id="course-title">Curso</h2>
      <span id="count" class="muted"></span>
    </div>
    <div class="row toolbar">
      <label><input type="checkbox" id="all" checked /> Todos</label>
      <button id="download" class="primary">Descargar seleccionados</button>
    </div>
    <ul id="lessons"></ul>
    <p id="note" class="muted small" hidden></p>
  </section>

  <section id="current" hidden>
    <h2>Video de esta lección</h2>
    <div id="current-list"></div>
  </section>

  <p id="message" class="muted">Buscando videos…</p>
  <script src="popup.js"></script>
</body>
</html>
